site_name: Attention Gym
site_description: Tools and examples for PyTorch FlexAttention
repo_url: https://github.com/meta-pytorch/attention-gym
repo_name: meta-pytorch/attention-gym

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.top
    - toc.follow
  logo: assets/hero.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/javascripts/perfetto-trace-embed.js
  - assets/javascripts/plotly-theme.js
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

watch:
  - examples

plugins:
  - search
  - macros
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started.md
      - Core Concepts: concepts.md
  - Guides:
      - Ragged CUDA Graphs: tutorials/cuda-graphs.md
      - Determinism: determinism.md
  - Reference:
      - Masks: masks.md
      - Score Mods: mods.md
      - Linear Attention: linear.md
      - Utilities: utilities.md
  - Examples: examples.md
  - Development:
      - CI Health: developers/ci-health.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
