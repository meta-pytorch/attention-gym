site_name: Attention Gym
site_description: Tools and examples for PyTorch FlexAttention
repo_url: https://github.com/meta-pytorch/attention-gym
repo_name: meta-pytorch/attention-gym

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow
  logo: assets/hero.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/javascripts/perfetto-trace-embed.js
  - assets/javascripts/plotly-theme.js
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

watch:
  - examples

exclude_docs: |
  AGENTS.md

plugins:
  - search
  - macros
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: google

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Tutorials:
      - CUDA Graphs: tutorials/cuda-graphs.md
  - Determinism: determinism.md
  - Masks: masks.md
  - Score Mods: mods.md
  - Linear Attention: linear.md
  - Examples: examples.md
  - Utilities: utilities.md
  - Developers:
      - Documentation Authoring: developers/documentation.md
      - CI Health: developers/ci-health.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
