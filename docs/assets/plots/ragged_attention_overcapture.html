<script>
(() => {
  const plot = document.querySelector('.plotly-graph-div');
  const experimentButtons = [...document.querySelectorAll('[data-experiment]')];
  const status = document.querySelector('.ragged-chart-status');
  const enabledBackends = new Set(['kda', 'fa2', 'fa4', 'fa4-persistent']);
  let experiment = 'fragmentation';

  const states = {
    fragmentation: {
      xTitle: 'active sequences M', xType: 'log',
      tickmode: 'array', tickvals: [1,2,4,8,16,32,64,128,256],
      ticktext: ['1','2','4','8','16','32','64','128','256'],
      subtitle: 'fixed T=L=8192 · captured vs exact'
    },
    'token-overcapture': {
      xTitle: 'active tokens L / T_max', xType: 'linear',
      tickmode: 'auto', tickvals: null, ticktext: null,
      subtitle: 'T_max=16384 · M=64 · captured vs exact'
    }
  };

  function selectState() {
    const state = states[experiment];
    const visible = plot.data.map((trace) => {
      if (trace.meta?.experiment !== experiment) return false;
      if (enabledBackends.has(trace.meta?.backend)) return true;
      return trace.showlegend ? 'legendonly' : false;
    });
    Plotly.update(plot, {visible}, {
      'xaxis.type': state.xType, 'xaxis2.type': state.xType,
      'xaxis.tickmode': state.tickmode, 'xaxis2.tickmode': state.tickmode,
      'xaxis.tickvals': state.tickvals, 'xaxis2.tickvals': state.tickvals,
      'xaxis.ticktext': state.ticktext, 'xaxis2.ticktext': state.ticktext,
      'xaxis.title.text': state.xTitle, 'xaxis2.title.text': state.xTitle,
      'yaxis2.type': experiment === 'fragmentation' ? 'linear' : 'log',
      'annotations[0].text': state.subtitle,
      'annotations[1].text': 'capacity slowdown versus exact'
    });
    experimentButtons.forEach((button) => {
      const selected = button.dataset.experiment === experiment;
      button.setAttribute('aria-selected', selected);
      button.tabIndex = selected ? 0 : -1;
    });
    status.textContent = `${enabledBackends.size} impls shown`;
  }

  experimentButtons.forEach((button, index) => {
    button.addEventListener('click', () => { experiment = button.dataset.experiment; selectState(); });
    button.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      event.preventDefault();
      const delta = event.key === 'ArrowRight' ? 1 : -1;
      const next = experimentButtons[(index + delta + experimentButtons.length) % experimentButtons.length];
      next.focus();
      next.click();
    });
  });

  plot.on('plotly_legendclick', (event) => {
    const backend = plot.data[event.curveNumber].legendgroup;
    if (enabledBackends.has(backend)) enabledBackends.delete(backend);
    else enabledBackends.add(backend);
    selectState();
    return false;
  });
  plot.on('plotly_legenddoubleclick', () => false);
  selectState();
})();
</script>
