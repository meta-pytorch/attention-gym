<script>
(() => {
  const plot = document.querySelector('.plotly-graph-div');
  const buttons = [...document.querySelectorAll('[data-dataset]')];
  const status = document.querySelector('.packing-status');
  let dataset = 'dolma3';

  function selectDataset() {
    const visible = plot.data.map((trace) => trace.meta?.dataset === dataset);
    Plotly.update(plot, {visible});
    buttons.forEach((button) => {
      const selected = button.dataset.dataset === dataset;
      button.setAttribute('aria-selected', selected);
      button.tabIndex = selected ? 0 : -1;
    });
    status.textContent = `${buttons.find((button) => button.dataset.dataset === dataset).textContent} shown`;
  }

  buttons.forEach((button, index) => {
    button.addEventListener('click', () => { dataset = button.dataset.dataset; selectDataset(); });
    button.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      event.preventDefault();
      const delta = event.key === 'ArrowRight' ? 1 : -1;
      const next = buttons[(index + delta + buttons.length) % buttons.length];
      next.focus();
      next.click();
    });
  });
  selectDataset();
})();
</script>
