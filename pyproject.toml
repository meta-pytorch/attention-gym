# pyproject.toml

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "attn_gym"
authors = [{ name = "Driss Guessous", email = "drisspguessous@gmail.com" }]
description = "Helpful tools and examples for working with flex-attention"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
]

[project.optional-dependencies]
linear = [
    "nvidia-cutlass-dsl[cu13]>=4.6.2; sys_platform == 'linux'",
    "apache-tvm-ffi>=0.1.11",
    "packaging",
]

cudnn = [
    "nvidia-cutlass-dsl[cu13]>=4.7.0; sys_platform == 'linux'",
    "cuda-python>=13.0; sys_platform == 'linux'",
    "apache-tvm-ffi>=0.1.11",
    "packaging",
]

tests = [
    "pytest",
    "pytest-xdist",
    "typer",
    "jsonargparse[signatures]",
    "flash-attn-4[cu13]~=4.0.0b33; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

dev = [
    "prek",
    "pytest",
    "pytest-xdist",  # pytest addopts pass --dist, so xdist must be present even for -n 0
    "ruff",
    "typer",
    "jsonargparse[signatures]",
]

viz = [
    "matplotlib",
    "jsonargparse[signatures]",
    "tabulate",
    "marimo",
]

docs = [
    "mkdocs-material",
    "mkdocs-macros-plugin",
    "mkdocs-redirects",
    "mkdocstrings[python]",
]

# ---------- TOOL CONFIGURATIONS ------------
[tool.uv]
conflicts = [
    [
        { extra = "cudnn" },
        { extra = "tests" },
    ],
]

[tool.hatch.version]
source = "vcs"

# Maintenance tools are importable in development, but are not part of the runtime wheel.
[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["attn_gym"]

# ---------- PYTEST ------------
[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["agent_space"]
# `-n` honors `xdist_group` marks, so tests that pin specific GPUs never run concurrently.
addopts = "--dist loadgroup"
markers = ["full_autotune: exercise every production Triton autotuning candidate"]

# ---------- RUFF ------------
[tool.ruff]
target-version = "py310"
line-length = 99
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*.ipynb",
]

[tool.ruff.lint]
ignore = ['E231', 'E731']

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"attn_gym/linear/kda/utils.py" = ["BLE001"]
"test/test_kda_kernels.py" = ["E402"]
# CuTeDSL traces if-expressions and nested ifs as device selects/branches; min/max builtins and
# `and` do not trace the same way on dynamic values, so keep the vendored control flow.
"attn_gym/linear/_delta_rule/cudnn_fe/{common,kernel,tile_dsl}/*.py" = ["FURB136", "PLR1730", "SIM102"]
