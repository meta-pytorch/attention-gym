# pyproject.toml

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "attn_gym"
authors = [{ name = "Driss Guessous", email = "drisspguessous@gmail.com" }]
description = "Helpful tools and examples for working with flex-attention"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
]

[project.optional-dependencies]
linear = [
    # 4.6.0/4.6.1 hang on a bulk copy issued in elect_one() (see attn_gym/warpdrive/compat.py).
    "nvidia-cutlass-dsl[cu13]>=4.6.2; sys_platform == 'linux'",
    "apache-tvm-ffi>=0.1.11",
    "packaging",
]

tests = [
    # xdist 3.8 loses loadgroup isolation with pytest 9.2.
    "pytest<9.2",
    "pytest-xdist",
    "typer",
    "jsonargparse[signatures]",
    "perfetto",  # warpdrive tracing/profiler tests read and write Perfetto traces
    "flash-attn-4[cu13]>=4.0.0b39; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

dev = [
    "prek",
    "pytest<9.2",
    "pytest-xdist",  # pytest addopts pass --dist, so xdist must be present even for -n 0
    "ruff",
    "typer",
    "jsonargparse[signatures]",
]

viz = [
    "matplotlib",
    "jsonargparse[signatures]",
    "tabulate",
    "marimo",
]

docs = [
    "mkdocs-material",
    "mkdocs-macros-plugin",
    "mkdocs-redirects",
    "mkdocstrings[python]",
]

# ---------- TOOL CONFIGURATIONS ------------
[tool.hatch.version]
source = "vcs"

# Maintenance tools are importable in development, but are not part of the runtime wheel.
[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
packages = ["attn_gym"]

# ---------- PYTEST ------------
[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["agent_space"]
# `-n` honors `xdist_group` marks, so tests that pin specific GPUs never run concurrently.
# Seeded warpdrive fuzz cases and the mutant check are skipped by default; run them with
# `pytest -m fuzz`. The unmarked regressions in test/warpdrive_fuzz always run.
addopts = "--dist loadgroup -m 'not fuzz'"
markers = [
    "full_autotune: exercise every production Triton autotuning candidate",
    "tuner_config(index): pin every gather_attn Triton tuner to that valid candidate",
    "fuzz: seeded warpdrive fuzz cases and layer mutant check; long campaigns: tools/warpdrive/fuzz_warpdrive.py",
]

# ---------- RUFF ------------
[tool.ruff]
target-version = "py310"
line-length = 99
# Apply excludes to paths passed explicitly, as pre-commit does.
force-exclude = true
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "*.ipynb",
]

[tool.ruff.format]
# Markdown code blocks hold pymdownx snippet directives (`--8<-- "file:section"`) that the
# formatter rewrites as Python expressions, breaking the includes.
exclude = ["*.md"]

[tool.ruff.lint]
ignore = ['E231', 'E731']

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"attn_gym/linear/kda/utils.py" = ["BLE001"]
"test/test_kda_kernels.py" = ["E402"]
# CuTeDSL traces nested ifs as device branches, so keep them in warpdrive's traced code (profiler
# included) and the kernels its tests build.
"{attn_gym/warpdrive,test/warpdrive,test/warpdrive_fuzz,test/profiler}/**/*.py" = ["SIM102"]
