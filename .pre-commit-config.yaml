# https://github.com/j178/prek - compatible with pre-commit hooks
# See https://pre-commit.com/hooks.html for available hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Upstream license and notice texts are vendored verbatim; draft patches keep the
        # whitespace of their blank context lines.
        exclude: '^(attn_gym/linear/_delta_rule/cudnn_fe/(LICENSE[^/]*|LICENSING\.md|NOTICE|THIRD_PARTY_LICENSES\.txt)|tools/cudnn_fe/upstream/.*\.patch)$'
      - id: end-of-file-fixer
        exclude: '^(attn_gym/linear/_delta_rule/cudnn_fe/(LICENSE[^/]*|LICENSING\.md|NOTICE|THIRD_PARTY_LICENSES\.txt)|tools/cudnn_fe/upstream/.*\.patch)$'
      - id: check-yaml
      - id: check-added-large-files
        exclude: '(^docs/assets/traces/hello_world_training_loop_comparison\.pftrace$|^docs/assets/widgets/cuda-graph-memory/max-vs-four-shared-buckets\.html$)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.1
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
