name: modal-tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Let the active main run finish its image build and save its compile cache. GitHub keeps
# only the latest pending run for this group; bursts of merges must not cancel every build.
# Attached Modal apps stop on client exit/disconnection; never add --detach below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install modal

      - name: Run pytest on a B200
        run: exec modal run --timestamps -m tools.modal_tests
